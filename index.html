<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario NAS100 · Leo</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--text:#e6ebf5;--muted:#8a96b0;--green:#2ecc71;--red:#e74c3c;--gold:#f1c40f;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar span{min-width:150px;text-align:center;font-weight:600}
button{background:var(--line);color:var(--text);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
button:hover{background:#34405f}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 24px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.kpi b{font-size:20px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:16px 24px 24px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{color:var(--muted);font-size:12px;text-align:center;padding:4px 0}
.day{min-height:68px;border-radius:8px;background:#141b2b;border:1px solid var(--line);padding:6px;font-size:13px;position:relative}
.day.out{opacity:.3}
.day.has{cursor:pointer}
.day.has:hover{border-color:var(--blue)}
.day.tp{background:rgba(46,204,113,.16);border-color:rgba(46,204,113,.45)}
.day.sl{background:rgba(231,76,60,.16);border-color:rgba(231,76,60,.45)}
.day .n{font-weight:600}
.day .pl{font-size:12px;margin-top:6px}
.day .flag{position:absolute;top:4px;right:6px;font-size:12px;color:var(--gold)}
.legend{color:var(--muted);font-size:12px;display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.pos{color:var(--green)}
.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:14px}
.stats div{padding:8px;background:#141b2b;border-radius:8px}
.stats small{display:block;color:var(--muted);font-size:12px}
svg{width:100%;height:auto;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;width:45%}
.obs{background:#141b2b;border-radius:8px;padding:10px;font-size:14px;line-height:1.5;margin-top:12px}
.concepto{background:rgba(241,196,15,.10);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;margin-top:10px}
.concepto b{color:var(--gold)}
.warn{background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.45);padding:8px 10px;border-radius:8px;font-size:13px;margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.photos img{width:100%;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fb{background:#141b2b;color:var(--text);border:1px solid var(--line);padding:5px 10px;font-size:13px}
.fb.on{background:var(--blue);border-color:var(--blue)}
.dir{display:inline-block;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:#141b2b;margin-top:4px}
.dir.sell{color:#e74c3c}
.dir.buy{color:#2ecc71}
.dir.none{color:var(--muted);font-weight:400}
.res{font-size:11px;font-weight:700;margin-top:3px}
.day.filtrado{border-style:dashed}
.ini{font-size:11px;margin-top:3px}
.leyenda{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.leg{background:#141b2b;color:var(--text);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)}
.leg.off{opacity:.35}
.fbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.fgrupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fb.reset{background:transparent;border-color:var(--line);color:var(--muted)}
.fcuenta{margin-left:auto}
.day.dim{opacity:.35}
.day.dim:hover{opacity:.75}
.kpi b.off{color:var(--muted)}
.leg:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#msg{padding:12px 24px 0}
#msg:empty{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>

<header>
  <h1>Diario NAS100 · Cuenta LEO MT4</h1>
  <div class="toolbar">
    <button id="prev">◀</button>
    <span id="mes"></span>
    <button id="next">▶</button>
  </div>
</header>

<div id="msg" class="muted"></div>

<section class="fbar" id="filtros"></section>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="card">
    <h2>Calendario</h2>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i class="dot" style="background:rgba(46,204,113,.5)"></i>TP de estrategia</span>
      <span><i class="dot" style="background:rgba(231,76,60,.5)"></i>SL de estrategia</span>
      <span><span style="color:var(--gold)">⚠</span> más de 2 ajustes</span>
    </div>
  </div>

  <div class="card">
    <h2>Acumulado: estrategia, ajustes y total (US$)</h2>
    <div id="wrap" style="position:relative">
      <svg id="grafica" viewBox="0 0 600 260"></svg>
      <div id="tip" style="display:none;position:absolute;pointer-events:none;background:#0f1420;border:1px solid #2a3550;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap"></div>
    </div>
    <div class="leyenda" id="leyenda"></div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<div id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="m-titulo" style="margin:0"></h2>
      <button id="cerrar">Cerrar</button>
    </div>
    <div id="m-cuerpo"></div>
  </div>
</div>

<script>
/* ==========================================================
   DATOS: copia aquí los valores de la hoja "Diario Completo Leo".
   - resultado: "TP" o "SL" (desenlace de la estrategia)
   - estrategia: número si operaste la estrategia (0 = BE), null si no operaste
   - ajustes: lista de ajustes discrecionales del día ([] si no hubo)
   - concepto: frase del día (columna "Concepto" del Excel); se muestra tal cual en el detalle
   Cada día nuevo: agrega una línea al final del arreglo.
   Capturas: carpeta "fotos" junto a este archivo, nombradas 2026-10-20_01.png, _02, etc.
   ========================================================== */
let CUENTA_INICIAL = 520.02;

let DATA = [
  {fecha:"2026-10-12", direccion:"SELL", resultado:"TP", estrategia:4.26, ajustes:[],
   obs:"Mercado con ruido, se ingresa a la operación asegurando un 50% y dejando correr, cierra SL positivo, se devuelve precio a Compra",
   concepto:"Proteger primero: con ruido, asegurar el 50% y dejar correr; el mercado paga después."},
  {fecha:"2026-10-13", direccion:"SELL", resultado:"SL", estrategia:0, ajustes:[],
   obs:"Ruido en Ventas, se asegura entrada inmediatamente queda en positivo se devuelve a SL",
   concepto:"Salir en cero también es ganar: en el ruido se asegura de inmediato y, si el precio se devuelve, la gestión ya hizo su trabajo."},
  {fecha:"2026-10-14", direccion:"SELL", resultado:"SL", estrategia:null, ajustes:[],
   obs:"PPA 300, SL Ahorrado",
   concepto:"No operar es una operación: con PPA 300 la señal pierde su ventaja y el SL ahorrado es capital protegido."},
  {fecha:"2026-10-15", direccion:"SELL", resultado:"SL", estrategia:null, ajustes:[],
   obs:"PPA 135, SL Ahorrado",
   concepto:"La constancia en la regla: segundo SL ahorrado seguido (PPA 135); el filtro cuida la cuenta aunque no se vea."},
  {fecha:"2026-10-16", direccion:"SELL", resultado:"TP", estrategia:null, ajustes:[],
   obs:"PA 59, TP",
   concepto:"La regla se juzga en la serie, no en un día: PA 59 dejó fuera un TP que corrió hasta 1:4 y aun así se respeta el filtro."},
  {fecha:"2026-10-19", direccion:"SELL", resultado:"SL", estrategia:-5.73, ajustes:[0,0],
   obs:"Apertura con ruido en compra, se abre la venta pero se devuelve el precio, tranquilo sin expectativa, se hacen ajustes quedan todos en protección en el retroceso de la vela",
   concepto:"Operar sin expectativa: si el precio se devuelve, proteger en el retroceso de la vela y aceptar la pérdida controlada."},
  {fecha:"2026-10-20", direccion:"SELL", resultado:"TP", estrategia:null, ajustes:[0,-1.96,2.5],
   obs:"PPA 141, se hacen 3 ajustes, por impulso se hace el tercero aunque se gano esa ultima debo respetar que maximo 2 operaciones, se hay estrategia un ajuste sino maximo 2 ajustes diarios (DISCIPLINA)",
   concepto:"Ganar por impulso no es disciplina: el tercer ajuste salió positivo, pero el límite de 2 ajustes no se negocia."}
];

const MAX_AJUSTES = 2;          // límite del plan
const MAX_PERDIDA_DISC = 0.40;  // % máximo de pérdida por ajustes
// Carpeta de las capturas, relativa a este archivo. "" = misma carpeta que el panel.
const CARPETA_FOTOS = "";

/* ---------- Cálculos ---------- */
function parseFecha(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function claveFecha(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function num(n){ return n==null ? 0 : n; }
function f2(n){ return n==null ? '—' : n.toFixed(2); }
function signo(n){ return n>0 ? 'pos' : n<0 ? 'neg' : ''; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let ROWS = [];
let MAP = {};
function construirFilas(){
let balance = CUENTA_INICIAL;
ROWS = DATA.map(d=>{
  const ini = balance;
  const est = num(d.estrategia);
  const disc = d.ajustes.reduce((a,b)=>a+num(b),0);
  const fin = ini + est + disc;
  balance = fin;
  return {
    ...d,
    ini, fin, est, disc,
    plDia: est + disc,
    pctDia: (est+disc)/ini*100,
    pctDisc: disc<0 ? disc/ini*100 : 0,
    nAjustes: d.ajustes.length,
    operoEstrategia: d.estrategia!=null,
    operaron: d.estrategia!=null || d.ajustes.length>0
  };
});
MAP = Object.fromEntries(ROWS.map(r=>[r.fecha,r]));
{
  let be = CUENTA_INICIAL;
  ROWS.forEach(r=>{ r.iniE = be; be += r.est; });
}

}
construirFilas();

function renderTodo(){
  construirFilas();
  aplicarFiltro();
  renderFiltros();
  renderCalendario();   // también actualiza los KPIs
  renderGrafica();
  renderStats();
}

/* ---------- Filtro global ----------
   op:  todas | estrategia | ajustes        dir: todas | SELL | BUY
   KPIs, calendario, gráfica y estadísticas se calculan solo con VIS:
   los días que cumplen el filtro, con el balance recalculado sobre esos días. */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let vista = (()=>{ const u=parseFecha(ROWS[ROWS.length-1].fecha); return {y:u.getFullYear(), m:u.getMonth()}; })();
let filtro = {op:'todas', dir:'todas'};
let VIS = [];
let VMAP = {};

function cumpleOp(r, op){ return op==='estrategia' ? r.operoEstrategia : op==='ajustes' ? r.nAjustes>0 : true; }
function cumpleDir(r, dir){ return dir==='todas' || r.direccion===dir; }
function hayFiltro(){ return filtro.op!=='todas' || filtro.dir!=='todas'; }

let ALL = [];   // días que cumplen el filtro en todos los meses, con el balance encadenado
function enMes(r){
  const f = parseFecha(r.fecha);
  return f.getFullYear()===vista.y && f.getMonth()===vista.m;
}

function aplicarFiltro(){
  let bal = CUENTA_INICIAL;
  ALL = ROWS.filter(r=>cumpleOp(r,filtro.op) && cumpleDir(r,filtro.dir)).map(r=>{
    const estV  = filtro.op==='ajustes'    ? 0 : r.est;
    const discV = filtro.op==='estrategia' ? 0 : r.disc;
    const iniV = bal;
    bal = iniV + estV + discV;
    return {...r, estV, discV, iniV, finV:bal, plV:estV+discV};
  });
  VIS = ALL.filter(enMes);      // lo que se ve: el mes elegido con el filtro aplicado
  VMAP = Object.fromEntries(VIS.map(r=>[r.fecha,r]));
}

function renderFiltros(){
  const delMes = ROWS.filter(enMes);
  const ops = [['todas','Todas'],['estrategia','Estrategia'],['ajustes','Ajustes']]
    .map(([k,t])=>[k,t,delMes.filter(r=>cumpleOp(r,k)&&cumpleDir(r,filtro.dir)).length]);
  const dirs = [['todas','Ambas'],['SELL','▼ SELL'],['BUY','▲ BUY']]
    .map(([k,t])=>[k,t,delMes.filter(r=>cumpleOp(r,filtro.op)&&cumpleDir(r,k)).length]);
  const grupo = (titulo, clave, arr)=>
    `<div class="fgrupo"><span class="muted">${titulo}</span>${arr.map(([k,t,n])=>
      `<button class="fb ${filtro[clave]===k?'on':''}" aria-pressed="${filtro[clave]===k}" data-clave="${clave}" data-v="${k}">${t} (${n})</button>`).join('')}</div>`;
  const el = document.getElementById('filtros');
  el.innerHTML = grupo('Operativa','op',ops) + grupo('Dirección','dir',dirs)
    + (hayFiltro() ? `<button class="fb reset" id="fReset">Quitar filtros</button>` : '')
    + `<span class="muted fcuenta">Mostrando ${VIS.length} de ${delMes.length} días de ${MESES[vista.m]}</span>`;
  el.querySelectorAll('[data-clave]').forEach(b=>{
    b.onclick = ()=>{ filtro[b.dataset.clave] = b.dataset.v; renderTodo(); };
  });
  const rs = document.getElementById('fReset');
  if(rs) rs.onclick = ()=>{ filtro = {op:'todas', dir:'todas'}; renderTodo(); };
}

/* ---------- KPIs ---------- */
function balanceInicioMes(){
  const corte = new Date(vista.y, vista.m, 1);
  const antes = ALL.filter(r=>parseFecha(r.fecha) < corte);
  return antes.length ? antes[antes.length-1].finV : CUENTA_INICIAL;
}

function renderKpis(){
  const filtrado = hayFiltro();
  const verEst  = filtro.op!=='ajustes';
  const verDisc = filtro.op!=='estrategia';
  const balIni = balanceInicioMes();
  const sumEst  = VIS.reduce((a,r)=>a+r.estV,0);
  const sumDisc = VIS.reduce((a,r)=>a+r.discV,0);
  const balFin = balIni + sumEst + sumDisc;
  const pct = balIni ? (balFin-balIni)/balIni*100 : 0;
  const nota = filtrado ? 'Balance simulado: balance de inicio de mes más el resultado de los días filtrados' : '';
  const k = [
    [filtrado?'Balance final filtrado':'Balance final', f2(balFin), '', nota],
    ['Resultado del mes', `${pct.toFixed(2)} %`, signo(pct), nota],
    ['Estrategia (mes)', verEst ? f2(sumEst) : '—', verEst ? signo(sumEst) : 'off', ''],
    ['Discrecional (mes)', verDisc ? f2(sumDisc) : '—', verDisc ? signo(sumDisc) : 'off', ''],
    ['Días en la vista', `${VIS.length} de ${ROWS.filter(enMes).length}`, '', '']
  ];
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><small>Balance inicial (${MESES[vista.m]})</small><b>${f2(balIni)}</b></div>` +
    k.map(([t,v,c,n])=>`<div class="kpi" ${n?`title="${n}"`:''}><small>${t}</small><b class="${c}">${v}</b></div>`).join('');
}

/* ---------- Estadísticas ---------- */
function renderStats(){
  if(!VIS.length){
    document.getElementById('stats').innerHTML = `<div style="grid-column:1/-1"><small>${ROWS.some(enMes) ? 'Ningún día cumple este filtro' : 'Sin datos en este mes'}</small></div>`;
    return;
  }
  const senales = VIS.length;
  const tp = VIS.filter(r=>r.resultado==='TP').length;
  const diasOp = VIS.filter(r=>r.operaron).length;

  let etiquetaGP, valorGP;
  if(filtro.op==='ajustes'){
    const aj = VIS.flatMap(r=>r.ajustes);
    etiquetaGP = 'Ajustes: ganadores / perdedores';
    valorGP = `${aj.filter(a=>a>0).length} / ${aj.filter(a=>a<0).length}`;
  } else {
    etiquetaGP = 'Estrategia: ganadoras / perdedoras';
    valorGP = `${VIS.filter(r=>r.operoEstrategia && r.estV>0).length} / ${VIS.filter(r=>r.operoEstrategia && r.estV<0).length}`;
  }

  const excedidos = VIS.filter(r=>r.nAjustes>MAX_AJUSTES).length;
  const excTxt = filtro.op==='estrategia' ? '—' : `<span class="${excedidos?'neg':''}">${excedidos}</span>`;

  const dirs = filtro.dir==='todas' ? ['SELL','BUY'] : [filtro.dir];
  const porDir = dirs.map(dir=>{
    const rs = VIS.filter(r=>r.direccion===dir);
    const tpD = rs.filter(r=>r.resultado==='TP').length;
    const txt = rs.length ? `${((tpD/rs.length)*100).toFixed(0)} % (${tpD} de ${rs.length})` : 'sin datos';
    return `<div><small>Acierto ${dir}</small>${txt}</div>`;
  }).join('');

  document.getElementById('stats').innerHTML = `
    <div><small>Acierto de la señal</small>${senales?((tp/senales)*100).toFixed(0):0} % (${tp} TP de ${senales})</div>
    <div><small>Días operados</small>${diasOp} de ${senales}</div>
    <div><small>${etiquetaGP}</small>${valorGP}</div>
    <div><small>Días con más de ${MAX_AJUSTES} ajustes</small>${excTxt}</div>
    ${porDir}
  `;
}

/* ---------- Gráfica interactiva: estrategia, ajustes y total ---------- */
const SERIES = [
  {k:'e', nombre:'Estrategia', color:'#3b82f6'},
  {k:'d', nombre:'Ajustes',    color:'#f1c40f'},
  {k:'t', nombre:'Total',      color:'#2ecc71'}
];
let serieVis = {e:true, d:true, t:true};

// Con el filtro "Estrategia" solo aplica la serie Estrategia; con "Ajustes", solo Ajustes
function serieRelevante(k){
  return k==='e' ? filtro.op!=='ajustes' : k==='d' ? filtro.op!=='estrategia' : filtro.op==='todas';
}

function acumulados(){
  let ce = 0, cd = 0;
  const pts = [{f:'Inicio', e:0, d:0, t:0}];
  VIS.forEach(r=>{ ce += r.estV; cd += r.discV; pts.push({f:r.fecha, e:ce, d:cd, t:ce+cd, r}); });
  return pts;
}

function renderGrafica(){
  if(!VIS.length){
    document.getElementById('grafica').innerHTML = `<text x="300" y="130" fill="#8a96b0" font-size="13" text-anchor="middle">${ROWS.some(enMes) ? 'Ningún día cumple este filtro' : 'Sin datos en este mes'}</text>`;
    document.getElementById('leyenda').innerHTML = '';
    document.getElementById('tip').style.display = 'none';
    return;
  }
  const W=600, H=260, pL=48, pR=12, pT=14, pB=30;
  const pts = acumulados();
  const activos = SERIES.filter(s=>serieVis[s.k] && serieRelevante(s.k));
  const vals = [0, ...pts.flatMap(p=>activos.map(s=>p[s.k]))];
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = Math.max((max-min)*0.12, 0.5);
  min -= pad; max += pad;
  const paso = (W-pL-pR)/Math.max(pts.length-1,1);
  const X = i => pL + i*paso;
  const Y = v => pT + (max-v)/(max-min)*(H-pT-pB);

  let svg = '';
  for(let t=0; t<=4; t++){
    const v = min + (max-min)*t/4;
    const yy = Y(v).toFixed(1);
    svg += `<line x1="${pL}" x2="${W-pR}" y1="${yy}" y2="${yy}" stroke="#2a3550"/>
            <text x="${pL-6}" y="${(+yy+4).toFixed(1)}" fill="#8a96b0" font-size="10" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  const y0 = Y(0).toFixed(1);
  svg += `<line x1="${pL}" x2="${W-pR}" y1="${y0}" y2="${y0}" stroke="#8a96b0" stroke-dasharray="4 4"/>`;
  pts.forEach((p,i)=>{
    const etiqueta = p.f==='Inicio' ? 'Ini' : p.f.slice(8);
    svg += `<text x="${X(i).toFixed(1)}" y="${H-10}" fill="#8a96b0" font-size="10" text-anchor="middle">${etiqueta}</text>`;
  });
  activos.forEach(s=>{
    const linea = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p[s.k]).toFixed(1)}`).join(' ');
    svg += `<polyline points="${linea}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    pts.forEach((p,i)=>{
      svg += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p[s.k]).toFixed(1)}" r="3.5" fill="${s.color}"/>`;
    });
  });
  if(!VIS.length){
    svg += `<text x="${W/2}" y="${H/2}" fill="#8a96b0" font-size="13" text-anchor="middle">Ningún día cumple este filtro</text>`;
  }
  svg += `<line id="guia" x1="0" x2="0" y1="${pT}" y2="${H-pB}" stroke="#e6ebf5" stroke-opacity=".4" visibility="hidden"/>`;
  svg += `<rect id="area" x="${pL}" y="${pT}" width="${W-pL-pR}" height="${H-pT-pB}" fill="transparent" style="cursor:pointer"/>`;

  const svgEl = document.getElementById('grafica');
  svgEl.innerHTML = svg;

  document.getElementById('leyenda').innerHTML = SERIES.map(s=>{
    const aplica = serieRelevante(s.k);
    const off = !aplica || !serieVis[s.k];
    return `<button class="leg ${off?'off':''}" data-k="${s.k}" ${aplica?'':'disabled title="No aplica con este filtro"'}><i class="dot" style="background:${s.color}"></i>${s.nombre}</button>`;
  }).join('');
  document.querySelectorAll('#leyenda .leg').forEach(b=>{
    b.onclick = ()=>{ serieVis[b.dataset.k] = !serieVis[b.dataset.k]; renderGrafica(); };
  });

  const area = document.getElementById('area');
  const guia = document.getElementById('guia');
  const tip  = document.getElementById('tip');
  const wrap = document.getElementById('wrap');
  const idxDe = ev=>{
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX-rect.left)/rect.width*W;
    return Math.max(0, Math.min(pts.length-1, Math.round((px-pL)/paso)));
  };
  area.onmousemove = ev=>{
    const wr = wrap.getBoundingClientRect();
    const idx = idxDe(ev);
    const gx = X(idx).toFixed(1);
    guia.setAttribute('x1', gx); guia.setAttribute('x2', gx);
    guia.setAttribute('visibility', 'visible');
    const p = pts[idx];
    const lineas = SERIES.filter(s=>serieRelevante(s.k))
      .map(s=>`<span style="color:${s.color}">${s.nombre}: ${p[s.k].toFixed(2)}</span>`).join('<br>');
    const dia = p.r
      ? `<br><span style="color:#8a96b0">${p.r.direccion||'—'} · ${p.r.resultado} · día ${p.r.plV>=0?'+':''}${f2(p.r.plV)}<br>Clic para abrir el día</span>`
      : '';
    tip.innerHTML = `<b>${p.f==='Inicio' ? 'Inicio' : p.f}</b><br>${lineas}${dia}`;
    tip.style.display = 'block';
    const left = ev.clientX - wr.left + 14;
    tip.style.left = Math.min(left, wr.width-170) + 'px';
    tip.style.top  = Math.max(0, ev.clientY - wr.top - 20) + 'px';
  };
  area.onmouseleave = ()=>{
    guia.setAttribute('visibility', 'hidden');
    tip.style.display = 'none';
  };
  area.onclick = ev=>{
    const p = pts[idxDe(ev)];
    if(p.r) abrir(p.f);
  };
}

/* ---------- Calendario ---------- */
function renderCalendario(){
  document.getElementById('mes').textContent = `${MESES[vista.m]} ${vista.y}`;
  renderKpis();
  const verEst  = filtro.op!=='ajustes';
  const verDisc = filtro.op!=='estrategia';
  const primero = new Date(vista.y, vista.m, 1);
  const inicio = (primero.getDay()+6)%7;
  const diasMes = new Date(vista.y, vista.m+1, 0).getDate();
  let html = ['L','M','X','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<inicio;i++) html += `<div class="day out"></div>`;

  for(let d=1; d<=diasMes; d++){
    const clave = claveFecha(new Date(vista.y, vista.m, d));
    const r = MAP[clave];
    if(!r){
      html += `<div class="day"><div class="n">${d}</div></div>`;
      continue;
    }
    const v = VMAP[clave];
    const dirHTML = r.direccion
      ? `<span class="dir ${r.direccion==='SELL'?'sell':'buy'}">${r.direccion==='SELL'?'▼ SELL':'▲ BUY'}</span>`
      : `<span class="dir none">sin dato</span>`;
    const tpsl = r.resultado==='TP' ? 'tp' : 'sl';
    const resHTML = `<div class="res ${r.resultado==='TP'?'pos':'neg'}">${r.resultado}</div>`;

    // Día fuera del filtro: se atenúa, pero se puede abrir
    if(!v){
      html += `<div class="day has dim ${tpsl}" data-f="${clave}"><div class="n">${d}</div>${dirHTML}${resHTML}</div>`;
      continue;
    }
    const clase = `day has ${tpsl} ${r.operoEstrategia?'':'filtrado'}`;
    const flag = (verDisc && r.nAjustes>MAX_AJUSTES) ? `<span class="flag">⚠</span>` : '';
    const plE = !verEst ? ''
      : r.operoEstrategia
        ? `<div class="pl ${signo(r.est)}">E ${r.est>=0?'+':''}${f2(r.est)}</div>`
        : `<div class="pl muted">sin operar</div>`;
    const plA = (verDisc && r.nAjustes)
      ? `<div class="pl ${signo(r.disc)}">A ${r.disc>=0?'+':''}${f2(r.disc)}</div>`
      : '';
    html += `<div class="${clase}" data-f="${clave}">${flag}<div class="n">${d}</div>
             <div class="ini muted">Ini ${f2(v.iniV)}</div>
             ${dirHTML}${resHTML}${plE}${plA}</div>`;
  }
  const cal = document.getElementById('cal');
  cal.innerHTML = html;
  cal.querySelectorAll('.day.has').forEach(el=>el.addEventListener('click', ()=>abrir(el.dataset.f)));
}

/* ---------- Detalle del día ---------- */
function fotosHTML(fecha){
  return `<div class="photos" id="fotos"></div><p class="muted" id="fotos-msg">Buscando capturas…</p>`;
}

// Busca NAS100_AAAAMMDD, _01, _02, _03 en png, jpg, jpeg (también en mayúsculas)
function cargarFotos(fecha){
  const c = fecha.replace(/-/g, '');
  const cont = document.getElementById('fotos');
  const msg = document.getElementById('fotos-msg');
  const bases = ['', '_01', '_02', '_03'].map(s=>`${CARPETA_FOTOS}NAS100_${c}${s}`);
  const exts = ['png','jpg','jpeg','PNG','JPG'];
  let hallados = 0, pendientes = bases.length;
  const fin = ()=>{
    if(--pendientes>0) return;
    msg.innerHTML = hallados
      ? `Capturas: NAS100_${c}.png, _01, _02, _03`
      : `No encontré capturas de este día. Busco <b>NAS100_${c}.png</b> (o .jpg) en la misma carpeta que este archivo, junto a <i>${esc(location.href.split('?')[0].replace(/[^\/]*$/, ''))}</i>`;
  };
  bases.forEach((base,i)=>{
    const slot = document.createElement('div');
    cont.appendChild(slot);
    const probar = k=>{
      if(k>=exts.length){ slot.remove(); fin(); return; }
      const img = new Image();
      img.alt = `Captura ${i+1}`;
      img.onload = ()=>{ slot.replaceWith(img); hallados++; fin(); };
      img.onerror = ()=>probar(k+1);
      img.src = `${base}.${exts[k]}`;
    };
    probar(0);
  });
}

function abrir(fecha){
  const r = MAP[fecha]; if(!r) return;
  const alertas = [];
  if(r.nAjustes>MAX_AJUSTES) alertas.push(`Se registraron ${r.nAjustes} ajustes; el plan permite máximo ${MAX_AJUSTES}.`);
  if(r.pctDisc < -MAX_PERDIDA_DISC) alertas.push(`La pérdida discrecional (${r.pctDisc.toFixed(2)} %) supera el ${MAX_PERDIDA_DISC} %.`);
  if(!r.operoEstrategia && r.nAjustes>0) alertas.push('Hubo ajustes sin operación de estrategia.');

  const ajustesTxt = r.ajustes.length ? r.ajustes.map((a,i)=>`A${i+1}: ${f2(a)}`).join(' · ') : '—';

  document.getElementById('m-titulo').textContent = parseFecha(fecha).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('m-cuerpo').innerHTML = `
    <table>
      <tr><th>Dirección</th><td>${r.direccion || '—'}</td></tr>
      <tr><th>Desenlace de la señal</th><td class="${r.resultado==='TP'?'pos':'neg'}">${r.resultado}</td></tr>
      <tr><th>Operó la estrategia</th><td>${r.operoEstrategia?'Sí':'No (filtro)'}</td></tr>
      <tr><th>Resultado estrategia</th><td class="${signo(r.est)}">${r.operoEstrategia?f2(r.est):'—'}</td></tr>
      <tr><th>Ajustes discrecionales</th><td>${ajustesTxt}</td></tr>
      <tr><th>Total discrecional</th><td class="${signo(r.disc)}">${f2(r.disc)}</td></tr>
      <tr><th>Balance inicial</th><td>${f2(r.ini)}</td></tr>
      <tr><th>Balance final</th><td>${f2(r.fin)}</td></tr>
      <tr><th>% del día</th><td class="${signo(r.pctDia)}">${r.pctDia.toFixed(2)} %</td></tr>
    </table>
    ${alertas.map(a=>`<div class="warn">⚠ ${esc(a)}</div>`).join('')}
    <div class="obs"><b>Observación:</b> ${esc(r.obs)}</div>
    ${r.concepto ? `<div class="concepto"><b>Concepto:</b> ${esc(r.concepto)}</div>` : ''}
    <h2 style="margin-top:16px">Capturas</h2>
    ${fotosHTML(fecha)}
  `;
  document.getElementById('modal').classList.add('open');
  cargarFotos(fecha);
}

function cargarFilas(filas, balanceExcel){
  DATA = filas;
  renderTodo();
  const ultimo = ROWS[ROWS.length-1].fin;
  const coincide = balanceExcel!==null && Math.abs(ultimo-balanceExcel) < 0.005;
  document.getElementById('msg').textContent = coincide ? '' :
    `⚠ El balance final del Excel (${f2(balanceExcel)}) no coincide con el del panel (${f2(ultimo)}). Revisa el balance inicial.`;
}

function procesarLibro(buf){
  const msg = document.getElementById('msg');
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets['Diario Completo Leo'];
  if(!ws){ msg.textContent = 'No encontré la hoja "Diario Completo Leo" en ese archivo.'; return; }
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const numv = v=>{
    if(typeof v === 'number') return v;
    if(v===null || v===undefined || String(v).trim()==='') return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? null : n;
  };
  const filas = [];
  let balanceExcel = null;
  rows.forEach(c=>{
    const x = c[0];
    if(typeof x !== 'number') return;
    const dt = new Date(Math.round((x - 25569) * 86400000));
    const fecha = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    filas.push({
      fecha,
      resultado: String(c[3]||'').trim().toUpperCase(),
      direccion: String(c[4]||'').trim().toUpperCase() || null,
      estrategia: numv(c[5]),
      ajustes: [6,7,8,9].map(i=>numv(c[i])).filter(v=>v!==null),
      obs: String(c[14]||'').trim(),
      concepto: String(c[15]||'').trim()
    });
    balanceExcel = numv(c[10]);
  });
  if(!filas.length){ msg.textContent = 'No encontré días en la hoja.'; return; }
  cargarFilas(filas, balanceExcel);
}

// Carga automática: si Magic_Number.xlsx está en la misma carpeta del panel, se lee al abrirlo
async function cargarDesdeRepo(){
  try{
    const r = await fetch('Magic_Number.xlsx', {cache:'no-store'});
    if(!r.ok) return;
    procesarLibro(await r.arrayBuffer());
  }catch(err){
    // Si se abre desde el disco (file://) no se puede leer el Excel; se usan los datos del archivo
  }
}
