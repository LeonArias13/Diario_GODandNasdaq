<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario NAS100 · Leo</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--text:#e6ebf5;--muted:#8a96b0;--green:#2ecc71;--red:#e74c3c;--gold:#f1c40f;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar span{min-width:150px;text-align:center;font-weight:600}
button{background:var(--line);color:var(--text);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
button:hover{background:#34405f}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 24px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.kpi b{font-size:20px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:16px 24px 24px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{color:var(--muted);font-size:12px;text-align:center;padding:4px 0}
.day{min-height:68px;border-radius:8px;background:#141b2b;border:1px solid var(--line);padding:6px;font-size:13px;position:relative}
.day.out{opacity:.3}
.day.has{cursor:pointer}
.day.has:hover{border-color:var(--blue)}
.day.tp{background:rgba(46,204,113,.16);border-color:rgba(46,204,113,.45)}
.day.sl{background:rgba(231,76,60,.16);border-color:rgba(231,76,60,.45)}
.day .n{font-weight:600}
.day .pl{font-size:12px;margin-top:6px}
.day .flag{font-size:12px;color:var(--gold);line-height:1}
.legend{color:var(--muted);font-size:12px;display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.pos{color:var(--green)}
.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:14px}
.stats div{padding:8px;background:#141b2b;border-radius:8px}
.stats small{display:block;color:var(--muted);font-size:12px}
svg{width:100%;height:auto;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;width:45%}
.obs{background:#141b2b;border-radius:8px;padding:10px;font-size:14px;line-height:1.5;margin-top:12px}
.concepto{background:rgba(241,196,15,.10);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;margin-top:10px}
.concepto b{color:var(--gold)}
.warn{background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.45);padding:8px 10px;border-radius:8px;font-size:13px;margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.photos img{width:100%;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fb{background:#141b2b;color:var(--text);border:1px solid var(--line);padding:5px 10px;font-size:13px}
.fb.on{background:var(--blue);border-color:var(--blue)}
.dir{display:inline-block;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:#141b2b;margin-top:4px}
.dir.sell{color:#e74c3c}
.dir.buy{color:#2ecc71}
.dir.none{color:var(--muted);font-weight:400}
.res{font-size:11px;font-weight:700;margin-top:3px}
.day.filtrado{border-style:dashed}
.ini{font-size:11px;margin-top:3px}
.leyenda{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.leg{background:#141b2b;color:var(--text);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)}
.leg.off{opacity:.35}
.fbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.fgrupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fb.reset{background:transparent;border-color:var(--line);color:var(--muted)}
.fcuenta{margin-left:auto}
.day.dim{opacity:.35}
.day.dim:hover{opacity:.75}
.kpi b.off{color:var(--muted)}
.leg:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.photos img{cursor:zoom-in}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:30}
#visor.open{display:flex}
#visor-marco{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
#visor-img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;cursor:zoom-out}
#visor.real #visor-marco{align-items:flex-start;justify-content:flex-start}
#visor.real #visor-img{max-width:none;max-height:none}
#visor-x,#visor-zoom{position:fixed;top:12px;z-index:31;padding:8px 14px;background:rgba(26,34,51,.9)}
#visor-x{right:12px}
#visor-zoom{right:64px}
#msg{padding:12px 24px 0}
#msg:empty{display:none}
/* ---- Compacto: todo el panel en una pantalla ---- */
header{padding:10px 24px}
h1{font-size:18px}
#fuente{font-size:11px;font-weight:500;margin-left:10px}
#fuente.fok{color:var(--green)}
#fuente.fno{color:var(--gold)}
.kpis{padding:10px 24px 0;gap:10px}
.kpi{padding:8px 12px}
.kpi small{margin-bottom:2px}
.kpi b{font-size:18px}
.grid{padding:10px 24px 16px;gap:12px}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chead h2{margin:0}
.fb{padding:3px 10px;font-size:12px}
#fcuenta{margin-left:auto;font-size:12px}
.lin{display:flex;flex-wrap:wrap;gap:1px 6px;align-items:baseline;margin-top:3px}
.lin .res,.lin .pl{margin:0}
.day .ini{font-size:10px;margin-top:1px}
.legend{gap:4px 12px;font-size:11px;margin-top:8px}
.stats{gap:8px;margin-top:8px;font-size:13px}
.stats div{padding:6px 8px}
.plan .pn{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;margin-top:4px}
.plan{max-width:430px;padding:6px 14px}
#wrap{position:relative;height:260px}
#grafica{position:absolute;inset:0;width:100%;height:100%}
@media (min-width:1000px) and (min-height:600px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  header,.kpis,#msg{flex:none}
  #msg{padding-top:6px}
  .grid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  .card{display:flex;flex-direction:column;min-height:0;padding:12px 14px}
  .card h2{margin:0 0 8px}
  .chead{flex:none}
  .cal{flex:1;min-height:0;gap:4px;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr)}
  .day{min-height:0;overflow:hidden;padding:4px 6px}
  .legend{flex:none}
  #wrap{flex:1;height:auto;min-height:0}
  .leyenda,.stats{flex:none}
}

.hright{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:250px;max-width:360px}

.plan .prox{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;background:#141b2b;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.chip.news{border-color:rgba(241,196,15,.55)}
.chip.zero{color:var(--muted)}
.tr{position:absolute;top:4px;right:4px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.pct{font-size:12px;font-weight:600;color:#7fb0ff;white-space:nowrap;line-height:1.2}
.pct.zero{color:var(--muted);font-weight:400}
.pct .news{font-size:10px}
.pct.nw{background:#1e3a8a;color:#fff;border:1px solid #3b82f6;border-radius:6px;padding:0 3px;font-size:10px}
.plan .pv b.nw{background:#1e3a8a;color:#fff;border:1px solid #3b82f6;border-radius:8px;padding:0 8px}
.chip.news{background:#1e3a8a;color:#fff}
.etp{position:absolute;bottom:4px;right:6px;font-size:9px;font-weight:700;color:#0f1420;padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.etp.lg{position:static;display:inline-block;font-size:11px;padding:2px 7px}
.noticia{background:rgba(59,130,246,.12);border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;margin:0 0 12px}
.noticia b{color:#7fb0ff}
.pl.desc{font-size:10px;margin-top:8px}
.pl.rev{color:#fbbf24;font-size:11px}
.day.revd{border-color:rgba(251,191,36,.5)}
/* ---- Resumen del mes ---- */
.rbtn{background:linear-gradient(135deg,#ffd84a,#e0a800);color:#0f1420;font-weight:700;padding:4px 14px;font-size:12px;border-radius:8px;letter-spacing:.02em}
.rbtn:hover{background:linear-gradient(135deg,#ffe58a,#f1c40f)}
#fcuenta + .rbtn{margin-left:8px}
#fcuenta:empty + .rbtn{margin-left:auto}
#rs{position:fixed;inset:0;background:rgba(5,8,16,.8);display:none;align-items:center;justify-content:center;padding:14px;z-index:12}
#rs.open{display:flex}
.rsheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:1020px;width:100%;max-height:95vh;overflow:auto}
.rx{position:absolute;top:10px;right:10px;z-index:2;background:rgba(15,20,32,.7)}
.boom{text-align:center;padding:40px 30px 26px;background:radial-gradient(ellipse at 50% 0,rgba(241,196,15,.2),transparent 70%);border-bottom:1px solid var(--line)}
.boom q{display:block;quotes:none;font:italic 700 clamp(24px,4.4vw,40px)/1.2 Georgia,"Times New Roman",serif;color:#ffe08a;text-shadow:0 0 30px rgba(241,196,15,.5);animation:boom .9s cubic-bezier(.2,.9,.2,1) both}
.boom small{display:block;margin-top:14px;color:var(--muted);font-size:12px;letter-spacing:.04em;animation:boom .9s .25s both}
.boom .rl{background:transparent;color:var(--muted);font-size:11px;padding:2px 8px;margin-left:8px;border:1px solid var(--line)}
@keyframes boom{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}55%{opacity:1;transform:scale(.97);filter:none}100%{opacity:1;transform:scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.boom q,.boom small{animation:none}}
.rbody{padding:16px 22px 24px}
.rbody h3{font-size:13px;margin:20px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.rbody h3:first-child{margin-top:0}
.rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.rk>div,.wl>div{background:#141b2b;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rk small,.wl small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.rk b{font-size:21px}
.rk em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:2px}
.wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.wl .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#0f1420;margin:4px 0 6px}
.bar i{display:block;height:100%}
.leg2{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.esc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.seg{background:#141b2b;border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--c)}
.seg h4{margin:0 0 2px;font-size:15px;color:var(--c)}
.seg .d{color:var(--muted);font-size:12px;margin-bottom:8px}
.seg table th{width:55%;font-size:12px}
.seg td,.seg th{padding:4px 2px}
.seg .meta{font-size:12px;margin-top:8px;color:var(--text)}
.mbar{height:8px;border-radius:5px;background:#0f1420;display:flex;overflow:hidden;margin:5px 0}
.mbar i{display:block;height:100%}
.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.ag div{background:#141b2b;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.ag div.nw{border-color:#3b82f6;background:rgba(59,130,246,.12)}
.ag b{display:block;font-size:15px;color:#7fb0ff}
.ag .z b{color:var(--muted);font-size:13px}
.reglas{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.reglas li::marker{color:var(--gold)}
.cierre{text-align:center;color:var(--gold);font:italic 14px Georgia,serif;margin-top:22px;opacity:.85}
.tb th{width:auto;font-size:12px}
.tb td,.tb th{padding:5px 8px}
.tb tr.on td,.tb tr.on th{background:rgba(59,130,246,.18)}
.tb tr.z0.on td,.tb tr.z0.on th{background:rgba(46,204,113,.18)}

.tb tr.z2.on td,.tb tr.z2.on th{background:rgba(231,76,60,.2)}
.tb tr.z3.on td,.tb tr.z3.on th{background:rgba(231,76,60,.4)}
.box{background:#141b2b;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
.box+.box{margin-top:10px}
.boom .hoy{display:inline-block;margin-top:14px;background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.4);border-radius:10px;padding:6px 14px;font:italic 15px Georgia,serif;color:#ffe08a;animation:boom .9s .25s both}
.boom .les{display:block;margin-top:10px;color:var(--muted);font-size:12px;animation:boom .9s .35s both}
</style>

<header>
  <h1>Diario NAS100 · Cuenta LEO MT4<span id="fuente"></span></h1>
  <div class="hright">
  <div class="plan" id="plan"></div>
  <div class="toolbar">
    <button id="prev">◀</button>

  </div>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="card">
    <div class="chead"><h2>Calendario</h2><div class="fgrupo" id="filtros"></div><span class="muted" id="fcuenta"></span><button class="rbtn" id="btnRes" title="Resumen, KPIs y proyección del mes">📊 Resumen</button></div>

      <span><i class="dot" style="background:rgba(46,204,113,.5)"></i>TP de estrategia</span>

<script>
/* ==========================================================
   DATOS: copia aquí los valores de la hoja "Diario Completo Leo".
   - resultado: "TP" o "SL" (desenlace de la estrategia)
   - estrategia: número si operaste la estrategia (0 = BE), null si no operaste
   - ajustes: lista de ajustes discrecionales del día ([] si no hubo)
   - concepto: frase del día (columna "Concepto" del Excel); se muestra tal cual en el detalle
   Cada día nuevo: agrega una línea al final del arreglo.
   Capturas: carpeta "fotos" junto a este archivo, nombradas 2026-10-20_01.png, _02, etc.
   ========================================================== */
let CUENTA_INICIAL = 520.02;

let DATA = [
  {fecha:"2026-10-12", etapa:"Semilla", direccion:"SELL", resultado:"TP", estrategia:4.26, ajustes:[],
   obs:"Mercado con ruido, se ingresa a la operación asegurando un 50% y dejando correr, cierra SL positivo, se devuelve precio a Compra",
   concepto:"Proteger primero: con ruido, asegurar el 50% y dejar correr; el mercado paga después."},
  {fecha:"2026-10-13", etapa:"Semilla", direccion:"SELL", resultado:"SL", estrategia:0, ajustes:[],
   obs:"Ruido en Ventas, se asegura entrada inmediatamente queda en positivo se devuelve a SL",
   concepto:"Salir en cero también es ganar: en el ruido se asegura de inmediato y, si el precio se devuelve, la gestión ya hizo su trabajo."},
  {fecha:"2026-10-14", etapa:"Semilla", direccion:"SELL", resultado:"SL", estrategia:null, ajustes:[],
   obs:"PPA 300, SL Ahorrado",
   concepto:"No operar es una operación: con PPA 300 la señal pierde su ventaja y el SL ahorrado es capital protegido."},
  {fecha:"2026-10-15", etapa:"Semilla", direccion:"SELL", resultado:"SL", estrategia:null, ajustes:[],
   obs:"PPA 135, SL Ahorrado",
   concepto:"La constancia en la regla: segundo SL ahorrado seguido (PPA 135); el filtro cuida la cuenta aunque no se vea."},
  {fecha:"2026-10-16", etapa:"Semilla", direccion:"SELL", resultado:"TP", estrategia:null, ajustes:[],
   obs:"PA 59, TP",
   concepto:"La regla se juzga en la serie, no en un día: PA 59 dejó fuera un TP que corrió hasta 1:4 y aun así se respeta el filtro."},
  {fecha:"2026-10-19", etapa:"Semilla", direccion:"SELL", resultado:"SL", estrategia:-5.73, ajustes:[0,0],
   obs:"Apertura con ruido en compra, se abre la venta pero se devuelve el precio, tranquilo sin expectativa, se hacen ajustes quedan todos en protección en el retroceso de la vela",
   concepto:"Operar sin expectativa: si el precio se devuelve, proteger en el retroceso de la vela y aceptar la pérdida controlada."},
  {fecha:"2026-10-20", etapa:"Semilla", direccion:"SELL", resultado:"TP", estrategia:null, ajustes:[0,-1.96,2.5],
   obs:"PPA 141, se hacen 3 ajustes, por impulso se hace el tercero aunque se gano esa ultima debo respetar que maximo 2 operaciones, se hay estrategia un ajuste sino maximo 2 ajustes diarios (DISCIPLINA)",

const ETAPAS_BASE = [['Semilla',0.02,30,0.07],['Incubación',0.005,60,0.07],['Aceleración',0.0035,60,0.07],['Pro',0.0035,60,0.07],['Pro 500',0.0035,60,0.07],['Pro M',0.0035,0,0]];   // [etapa, % operación, días de la etapa (0 = sin fin), % a ganar en la etapa (0 = sin objetivo)]
const RIESGO_BASE = {1:2,2:2,3:1,4:2,5:1,6:0,0:0};   // ratio por día de la semana (0 = domingo)
const PLAN_HASTA = '2027-12-31';                     // el panel genera el plan hasta esta fecha
let ETAPAS = ETAPAS_BASE.map(([nombre,op,dias,meta])=>({nombre,op,dias,meta}));
let RIESGO = {...RIESGO_BASE};

/* Construye el calendario de etapas día por día a partir de las filas del Excel:
   - Si la fila del Excel trae una Etapa, esa etapa manda ese día (así puedes quedarte un día más en Semilla).
   - Si no trae etapa, la etapa sigue hasta cumplir sus días y luego pasa a la siguiente (Pro M no termina).
   - Cada etapa cuenta sus días por separado: la primera conserva el día de la hoja (mañana = día 16) y las demás arrancan en 1.
   - % planeado = % de la etapa × ratio del día de la semana (a la mitad si hay noticia). */
function setMetas(arr){
  METAS = {};
  const filas = [...arr].sort((a,b)=> a[0]<b[0] ? -1 : a[0]>b[0] ? 1 : 0);
  if(!filas.length) return;
  const porFecha = Object.fromEntries(filas.map(a=>[a[0],a]));
  const orden = ETAPAS.map(e=>e.nombre);
  const info = n=>ETAPAS.find(e=>e.nombre===n);
  const ini = filas.find(a=>a[2]) || filas[0];
  const d = parseFecha(ini[0]), fin = parseFecha(PLAN_HASTA);
  let etapa = null, dia = 0;
  while(d<=fin){
    const k = claveFecha(d), f = porFecha[k];
    let nueva;
    if(f && f[2]) nueva = f[2];
    else {
      const e = info(etapa);
      nueva = (e && e.dias>0 && dia>=e.dias) ? orden[Math.min(orden.indexOf(etapa)+1, orden.length-1)] : etapa;
    }
    if(etapa===null){ etapa = nueva; dia = ini[1] || 1; }
    else if(nueva===etapa) dia++;
    else { etapa = nueva; dia = 1; }
    const e = info(etapa);
    const ratio = RIESGO[d.getDay()] || 0;
    const noticia = f ? f[5] : 0;
    METAS[k] = {fecha:k, dia, etapa, ratio, plan: e ? e.op*ratio*(noticia>0?0.5:1) : 0, noticia, nota: f ? f[6] : ''};
    d.setDate(d.getDate()+1);
  }
}
setMetas(METAS_BASE);
function fmtPlan(v){ return (Math.round(v*10000)/100)+' %'; }

// Lee la hoja "Metas" del Excel (Fecha, Dia Semana, Dia Comienzo Meta, Ratio, Etapa, % Op., % Esperado, % Planeado, Noticia, Nota)
function leerReglas(wb, n){
  const filasDe = nombre=> wb.Sheets[nombre] ? XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:true, defval:null}) : [];
  const et = [];
  filasDe('Etapas').forEach(c=>{
    const nom = String(c[0]||'').trim();
    if(nom && typeof c[1]==='number') et.push({nombre:nom, op:n(c[1]), dias:n(c[3]), meta:n(c[6])});
  });
  if(et.length) ETAPAS = et;
  const dias = {LUNES:1, MARTES:2, 'MIÉRCOLES':3, MIERCOLES:3, JUEVES:4, VIERNES:5, 'SÁBADO':6, SABADO:6, DOMINGO:0};
  const ri = {};
  filasDe('Riesgo').forEach(c=>{
    const k = dias[String(c[0]||'').trim().toUpperCase()];
    if(k!==undefined && typeof c[1]==='number') ri[k] = c[1];
  });
  if(Object.keys(ri).length) RIESGO = {...RIESGO_BASE, ...ri};
}
function leerMetas(wb){
  const ws = wb.Sheets['Metas']; if(!ws) return;
  const n = v=> typeof v==='number' ? v : (parseFloat(String(v==null?'':v).replace(',','.'))||0);
  leerReglas(wb, n);
  const arr = [];
  XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null}).forEach(c=>{
    if(typeof c[0] !== 'number') return;
    const etapa = String(c[4]||'').trim();
    if(!etapa && !(n(c[8])>0)) return;   // sin etapa solo se guarda si trae noticia
    const dt = new Date(Math.round((c[0] - 25569) * 86400000));
    const fecha = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    arr.push([fecha, n(c[2]), etapa, n(c[3]), n(c[7]), n(c[8]), String(c[9]||'').trim()]);
  });
  if(arr.length) setMetas(arr);
}

// Acumulado por etapa hasta una fecha: suma de los % del día de cada etapa (como la columna "% Acumulado" del Excel)
// y, entre paréntesis, lo que falta para el objetivo de la etapa (columna "% a Ganar" de la hoja Etapas)
function acumEtapas(fecha){
  const hoy = claveFecha(new Date());
  const ult = ROWS.length ? ROWS[ROWS.length-1].fecha : '';
  if(!ROWS.length || fecha > (hoy > ult ? hoy : ult)) return '';
  const orden = [], acc = {};
  ROWS.forEach(r=>{
    if(r.fecha > fecha) return;
    const e = r.etapa || etapaDe(r.fecha) || 'Sin etapa';
    if(!(e in acc)){ acc[e] = 0; orden.push(e); }
    acc[e] += r.pctDia;
  });
  return orden.map(e=>{
    const inf = ETAPAS.find(x=>x.nombre===e);
    const meta = inf && inf.meta>0 ? inf.meta*100 : 0;
    const a = acc[e], falta = meta - a;
    const txt = !meta ? ''
      : falta > 0 ? ` <span style="color:#f1c40f;font-weight:700">(faltan ${falta.toFixed(2)} % de ${+meta.toFixed(2)} %)</span>`
      : ` <span class="pos">(objetivo de ${+meta.toFixed(2)} % cumplido, ${(-falta).toFixed(2)} % de más)</span>`;
    return `<tr><th>Acumulado ${esc(e)}</th><td class="${signo(a)}">${a>=0?'+':''}${a.toFixed(2)} %${txt}</td></tr>`;
  }).join('');
}

/* ---------- Filtro global ----------
   op:  todas | estrategia | ajustes
   KPIs, calendario, gráfica y estadísticas se calculan solo con VIS:
   los días que cumplen el filtro, con el balance recalculado sobre esos días. */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let vista = (()=>{ const u=parseFecha(ROWS[ROWS.length-1].fecha); return {y:u.getFullYear(), m:u.getMonth()}; })();
let filtro = {op:'todas'};
let VIS = [];
let VMAP = {};

function cumpleOp(r, op){ return op==='estrategia' ? r.operoEstrategia : op==='ajustes' ? r.nAjustes>0 : true; }
function hayFiltro(){ return filtro.op!=='todas'; }

let ALL = [];   // días que cumplen el filtro en todos los meses, con el balance encadenado
function enMes(r){
  const f = parseFecha(r.fecha);
  return f.getFullYear()===vista.y && f.getMonth()===vista.m;
}

function aplicarFiltro(){
  let bal = CUENTA_INICIAL;
  ALL = ROWS.filter(r=>cumpleOp(r,filtro.op)).map(r=>{
    const estV  = filtro.op==='ajustes'    ? 0 : r.est;
    const discV = filtro.op==='estrategia' ? 0 : r.disc;
    const iniV = bal;
    bal = iniV + estV + discV;
    return {...r, estV, discV, iniV, finV:bal, plV:estV+discV};
  });
  VIS = ALL.filter(enMes);      // lo que se ve: el mes elegido con el filtro aplicado
  VMAP = Object.fromEntries(VIS.map(r=>[r.fecha,r]));
}

function renderFiltros(){
  const delMes = ROWS.filter(enMes);
  const ops = [['todas','Todas'],['estrategia','Estrategia'],['ajustes','Ajustes']]
    .map(([k,t])=>[k,t,delMes.filter(r=>cumpleOp(r,k)).length]);
  const el = document.getElementById('filtros');
  el.innerHTML = ops.map(([k,t,n])=>
    `<button class="fb ${filtro.op===k?'on':''}" aria-pressed="${filtro.op===k}" data-v="${k}">${t} (${n})</button>`).join('');
  el.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick = ()=>{ filtro.op = b.dataset.v; renderTodo(); };
  });
  document.getElementById('fcuenta').textContent = hayFiltro() ? `Mostrando ${VIS.length} de ${delMes.length} días` : '';
}

/* ---------- KPIs ---------- */
function balanceInicioMes(){
  const corte = new Date(vista.y, vista.m, 1);
  const antes = ALL.filter(r=>parseFecha(r.fecha) < corte);
  return antes.length ? antes[antes.length-1].finV : CUENTA_INICIAL;
}

function renderKpis(){
  const filtrado = hayFiltro();
  const verEst  = filtro.op!=='ajustes';
  const verDisc = filtro.op!=='estrategia';
  const balIni = balanceInicioMes();
  const sumEst  = VIS.reduce((a,r)=>a+r.estV,0);
  const sumDisc = VIS.reduce((a,r)=>a+r.discV,0);
  const balFin = balIni + sumEst + sumDisc;
  const pct = balIni ? (balFin-balIni)/balIni*100 : 0;
  const nota = filtrado ? 'Balance simulado: balance de inicio de mes más el resultado de los días filtrados' : '';
  const k = [
    [filtrado?'Balance final filtrado':'Balance final', f2(balFin), '', nota],
    ['Resultado del mes', `${pct.toFixed(2)} %`, signo(pct), nota],
    ['Estrategia (mes)', verEst ? f2(sumEst) : '—', verEst ? signo(sumEst) : 'off', ''],
    ['Discrecional (mes)', verDisc ? f2(sumDisc) : '—', verDisc ? signo(sumDisc) : 'off', ''],
    ['Días en la vista', `${VIS.length} de ${ROWS.filter(enMes).length}`, '', '']
  ];
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><small>Balance inicial (${MESES[vista.m]})</small><b>${f2(balIni)}</b></div>` +
    k.map(([t,v,c,n])=>`<div class="kpi" ${n?`title="${n}"`:''}><small>${t}</small><b class="${c}">${v}</b></div>`).join('');
}

/* ---------- Estadísticas ---------- */
function renderStats(){
  if(!VIS.length){
    document.getElementById('stats').innerHTML = `<div style="grid-column:1/-1"><small>${ROWS.some(enMes) ? 'Ningún día cumple este filtro' : 'Sin datos en este mes'}</small></div>`;
    return;
  }
  const senales = VIS.length;
  const tp = VIS.filter(r=>r.resultado==='TP').length;
  const diasOp = VIS.filter(r=>r.operaron).length;

  let etiquetaGP, valorGP;
  if(filtro.op==='ajustes'){
    const aj = VIS.flatMap(r=>r.ajustes);
    etiquetaGP = 'Ajustes: ganadores / perdedores';
    valorGP = `${aj.filter(a=>a>0).length} / ${aj.filter(a=>a<0).length}`;
  } else {
    etiquetaGP = 'Estrategia: ganadoras / perdedoras';
    valorGP = `${VIS.filter(r=>r.operoEstrategia && r.estV>0).length} / ${VIS.filter(r=>r.operoEstrategia && r.estV<0).length}`;
  }

  const excedidos = VIS.filter(r=>r.nAjustes>MAX_AJUSTES).length;
  const excTxt = filtro.op==='estrategia' ? '—' : `<span class="${excedidos?'neg':''}">${excedidos}</span>`;

  document.getElementById('stats').innerHTML = `
    <div><small>Acierto de la señal</small>${senales?((tp/senales)*100).toFixed(0):0} % (${tp} TP de ${senales})</div>
    <div><small>Días operados</small>${diasOp} de ${senales}</div>
    <div><small>${etiquetaGP}</small>${valorGP}</div>
    <div><small>Días con más de ${MAX_AJUSTES} ajustes</small>${excTxt}</div>
  `;
}

/* ---------- Gráfica interactiva: estrategia, ajustes y total ---------- */
const SERIES = [
  {k:'e', nombre:'Estrategia', color:'#3b82f6'},
  {k:'d', nombre:'Ajustes',    color:'#f1c40f'},
  {k:'t', nombre:'Total',      color:'#2ecc71'},
  {k:'p', nombre:'% acumulado', color:'#b388ff'}
];
let serieVis = {e:true, d:true, t:true, p:true};

// Con el filtro "Estrategia" solo aplica la serie Estrategia; con "Ajustes", solo Ajustes
function serieRelevante(k){
  if(k==='p') return true;   // el % acumulado del mes aplica con cualquier filtro
  return k==='e' ? filtro.op!=='ajustes' : k==='d' ? filtro.op!=='estrategia' : filtro.op==='todas';
}

// Balance inicial de la etapa del día, objetivo (inicio × (1 + meta %)) y lo que falta en USD
function etapaInfo(r){
  const e = r.etapa || etapaDe(r.fecha);
  const primera = ROWS.find(x=>(x.etapa || etapaDe(x.fecha))===e) || MAP[r.fecha] || r;
  const ini = primera.ini;
  const meta = (ETAPAS.find(x=>x.nombre===e)||{}).meta || 0;
  return {nombre:e, ini, meta, objetivo: ini*(1+meta)};
}
// Balance final del día con la cuenta completa (sin filtros)
function balFinDia(r){
  const f = MAP[r.fecha];
  return f ? f.fin : r.finV;
}
function faltaTxt(r){
  const info = etapaInfo(r);
  if(!info.meta) return 'sin objetivo en la etapa';
  const falta = info.objetivo - balFinDia(r);
  return falta > 0 ? `faltan ${f2(falta)} USD para ${info.nombre}` : `meta de ${info.nombre} cumplida`;
}
// Texto junto al Balance final en el detalle del día
function faltaUSD(r){
  const info = etapaInfo(r);
  if(!info.meta) return '';
  const falta = info.objetivo - balFinDia(r);
  return falta > 0
    ? ` <span style="color:#f1c40f;font-weight:700">(faltan ${f2(falta)} USD)</span>`
    : ` <span style="color:#f1c40f;font-weight:700">(meta de ${esc(info.nombre)} cumplida)</span>`;
}

function acumulados(){
  let ce = 0, cd = 0;
  const pts = [{f:'Inicio', e:0, d:0, t:0, p:0}];
  VIS.forEach(r=>{ ce += r.estV; cd += r.discV; const ini = etapaInfo(r).ini || 1;
    pts.push({f:r.fecha, e:ce, d:cd, t:ce+cd, p:(balFinDia(r) - ini)/ini*100, r}); });
  return pts;
}

function renderGrafica(){
  if(!VIS.length){
    document.getElementById('grafica').innerHTML = `<text x="300" y="130" fill="#8a96b0" font-size="13" text-anchor="middle">${ROWS.some(enMes) ? 'Ningún día cumple este filtro' : 'Sin datos en este mes'}</text>`;
    document.getElementById('leyenda').innerHTML = '';
    document.getElementById('tip').style.display = 'none';
    return;
  }
  const wrapEl = document.getElementById('wrap');
  const W = Math.max(320, wrapEl.clientWidth || 600), H = Math.max(150, wrapEl.clientHeight || 260);
  const pL=48, pR=50, pT=14, pB=30;
  document.getElementById('grafica').setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pts = acumulados();
  const b0 = balanceInicioMes() || 1;
  const activos = SERIES.filter(s=>serieVis[s.k] && serieRelevante(s.k));
  const vals = [0, ...pts.flatMap(p=>activos.map(s=>s.k==='p' ? p.t : p[s.k]))];
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = Math.max((max-min)*0.12, 0.5);
  min -= pad; max += pad;
  const paso = (W-pL-pR)/Math.max(pts.length-1,1);
  const X = i => pL + i*paso;
  const Y = v => pT + (max-v)/(max-min)*(H-pT-pB);

  let svg = '';
  for(let t=0; t<=4; t++){
    const v = min + (max-min)*t/4;
    const yy = Y(v).toFixed(1);
    svg += `<line x1="${pL}" x2="${W-pR}" y1="${yy}" y2="${yy}" stroke="#2a3550"/>
            <text x="${pL-6}" y="${(+yy+4).toFixed(1)}" fill="#8a96b0" font-size="10" text-anchor="end">${v.toFixed(2)}</text>`;
    if(activos.some(s=>s.k==='p')){
      svg += `<text x="${W-pR+6}" y="${(+yy+4).toFixed(1)}" fill="#b388ff" font-size="10" text-anchor="start">${(v/b0*100).toFixed(2)}%</text>`;
    }
  }
  const y0 = Y(0).toFixed(1);
  svg += `<line x1="${pL}" x2="${W-pR}" y1="${y0}" y2="${y0}" stroke="#8a96b0" stroke-dasharray="4 4"/>`;
  pts.forEach((p,i)=>{
    const etiqueta = p.f==='Inicio' ? 'Ini' : p.f.slice(8);
    svg += `<text x="${X(i).toFixed(1)}" y="${H-10}" fill="#8a96b0" font-size="10" text-anchor="middle">${etiqueta}</text>`;
  });
  activos.forEach(s=>{
    const esPct = s.k==='p';
    const kk = esPct ? 't' : s.k;   // el % usa la misma escala vertical: el eje derecho es el eje izquierdo convertido a %
    const linea = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p[kk]).toFixed(1)}`).join(' ');
    svg += `<polyline points="${linea}" fill="none" stroke="${s.color}" stroke-width="${esPct?2:2.5}"${esPct?' stroke-dasharray="6 4"':''}/>`;
    pts.forEach((p,i)=>{
      svg += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p[kk]).toFixed(1)}" r="${esPct?2.5:3.5}" fill="${s.color}"/>`;
    });
  });
  if(!VIS.length){
    svg += `<text x="${W/2}" y="${H/2}" fill="#8a96b0" font-size="13" text-anchor="middle">Ningún día cumple este filtro</text>`;
  }
  svg += `<line id="guia" x1="0" x2="0" y1="${pT}" y2="${H-pB}" stroke="#e6ebf5" stroke-opacity=".4" visibility="hidden"/>`;
  svg += `<rect id="area" x="${pL}" y="${pT}" width="${W-pL-pR}" height="${H-pT-pB}" fill="transparent" style="cursor:pointer"/>`;

  const svgEl = document.getElementById('grafica');
  svgEl.innerHTML = svg;

  document.getElementById('leyenda').innerHTML = SERIES.map(s=>{
    const aplica = serieRelevante(s.k);
    const off = !aplica || !serieVis[s.k];
    return `<button class="leg ${off?'off':''}" data-k="${s.k}" ${aplica?'':'disabled title="No aplica con este filtro"'}><i class="dot" style="background:${s.color}"></i>${s.nombre}</button>`;
  }).join('');
  document.querySelectorAll('#leyenda .leg').forEach(b=>{
    b.onclick = ()=>{ serieVis[b.dataset.k] = !serieVis[b.dataset.k]; renderGrafica(); };
  });

  const area = document.getElementById('area');
  const guia = document.getElementById('guia');
  const tip  = document.getElementById('tip');
  const wrap = document.getElementById('wrap');
  const idxDe = ev=>{
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX-rect.left)/rect.width*W;
    return Math.max(0, Math.min(pts.length-1, Math.round((px-pL)/paso)));
  };
  area.onmousemove = ev=>{
    const wr = wrap.getBoundingClientRect();
    const idx = idxDe(ev);
    const gx = X(idx).toFixed(1);
    guia.setAttribute('x1', gx); guia.setAttribute('x2', gx);
    guia.setAttribute('visibility', 'visible');
    const p = pts[idx];
    const lineas = SERIES.filter(s=>serieRelevante(s.k))
      .map(s=>`<span style="color:${s.color}">${s.nombre}: ${s.k==='p' ? p.p.toFixed(2)+' %' : p[s.k].toFixed(2)}</span>`).join('<br>');
    const dia = p.r
      ? `<br><span style="color:#8a96b0">${p.r.resultado} · día ${p.r.plV>=0?'+':''}${f2(p.r.plV)}<br>Balance final: ${f2(balFinDia(p.r))} <span style="color:#f1c40f;font-weight:700">(${faltaTxt(p.r)})</span><br>Clic para abrir el día</span>`
      : '';
    tip.innerHTML = `<b>${p.f==='Inicio' ? 'Inicio' : p.f}</b><br>${lineas}${dia}`;
    tip.style.display = 'block';
    const left = ev.clientX - wr.left + 14;
    tip.style.left = Math.min(left, wr.width-170) + 'px';
    tip.style.top  = Math.max(0, ev.clientY - wr.top - 20) + 'px';
  };
  area.onmouseleave = ()=>{
    guia.setAttribute('visibility', 'hidden');
    tip.style.display = 'none';
  };
  area.onclick = ev=>{
    const p = pts[idxDe(ev)];
    if(p.r) abrir(p.f);
  };
}

/* ---------- Calendario ---------- */
function renderCalendario(){
  document.getElementById('mes').textContent = `${MESES[vista.m]} ${vista.y}`;
  renderKpis();
  renderLegEtapas();
  const verEst  = filtro.op!=='ajustes';
  const verDisc = filtro.op!=='estrategia';
  const primero = new Date(vista.y, vista.m, 1);
  const inicio = (primero.getDay()+6)%7;
  const diasMes = new Date(vista.y, vista.m+1, 0).getDate();
  let html = ['L','M','X','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<inicio;i++) html += `<div class="day out"></div>`;

  for(let d=1; d<=diasMes; d++){
    const clave = claveFecha(new Date(vista.y, vista.m, d));
    const r = MAP[clave];
    if(!r){
      const mt = METAS[clave], rv = REVS[clave];
      const fd = parseFecha(clave), finde = fd.getDay()===0 || fd.getDay()===6;
      const clic = mt || rv || clave <= claveFecha(new Date());
      const marca = rv ? `<div class="pl rev">📝 revisión</div>`
                  : ((finde || (mt && mt.plan===0)) && etapaDe(clave)) ? `<div class="pl muted desc">descanso</div>` : '';
      html += `<div class="day${clic?' has':''}${rv?' revd':''}"${clic?` data-f="${clave}"`:''}><div class="n">${d}</div>${esquina(clave,'')}${marca}${pillEtapa(clave)}</div>`;
      continue;
    }
    const v = VMAP[clave];
    const tpsl = r.resultado==='TP' ? 'tp' : 'sl';
    const resHTML = `<div class="res ${r.resultado==='TP'?'pos':'neg'}">${r.resultado}</div>`;

    // Día fuera del filtro: se atenúa, pero se puede abrir
    if(!v){
      html += `<div class="day has dim ${tpsl}" data-f="${clave}"><div class="n">${d}</div>${esquina(clave,'')}<div class="lin">${resHTML}</div>${pillEtapa(clave)}</div>`;
      continue;
    }
    const clase = `day has ${tpsl} ${r.operoEstrategia?'':'filtrado'}`;
    const flag = (verDisc && r.nAjustes>MAX_AJUSTES) ? `<span class="flag">⚠</span>` : '';
    const plE = !verEst ? ''
      : r.operoEstrategia
        ? `<div class="pl ${signo(r.est)}">E ${r.est>=0?'+':''}${f2(r.est)}</div>`
        : `<div class="pl muted">sin operar</div>`;
    const plA = (verDisc && r.nAjustes)
      ? `<div class="pl ${signo(r.disc)}">A ${r.disc>=0?'+':''}${f2(r.disc)}</div>`
      : '';
    html += `<div class="${clase}" data-f="${clave}"><div class="n">${d}</div>${esquina(clave,flag)}
             <div class="lin">${resHTML}${plE}${plA}</div>${pillEtapa(clave)}</div>`;
  }
  const cal = document.getElementById('cal');
  cal.innerHTML = html;
  cal.querySelectorAll('.day.has').forEach(el=>el.addEventListener('click', ()=>abrir(el.dataset.f)));
}

function fotosHTML(fecha){

}

// Busca NAS100_AAAAMMDD, _01, _02, _03 en png, jpg, jpeg (también en mayúsculas)
function cargarFotos(fecha){
  const c = fecha.replace(/-/g, '');
  const cont = document.getElementById('fotos');
  const msg = document.getElementById('fotos-msg');
  const bases = ['', '_01', '_02', '_03'].map(s=>`${CARPETA_FOTOS}NAS100_${c}${s}`);
  const exts = ['png','jpg','jpeg','PNG','JPG'];
  let hallados = 0, pendientes = bases.length;
  const fin = ()=>{
    if(--pendientes>0) return;
    msg.innerHTML = hallados
      ? `Capturas: NAS100_${c}.png, _01, _02, _03`
      : `No encontré capturas de este día. Busco <b>NAS100_${c}.png</b> (o .jpg) en la misma carpeta que este archivo, junto a <i>${esc(location.href.split('?')[0].replace(/[^\/]*$/, ''))}</i>`;
  };
  bases.forEach((base,i)=>{
    const slot = document.createElement('div');
    cont.appendChild(slot);
    const probar = k=>{
      if(k>=exts.length){ slot.remove(); fin(); return; }
      const img = new Image();
      img.alt = `Captura ${i+1}`;
      img.onload = ()=>{ slot.replaceWith(img); img.onclick = ()=>ampliar(img.src); hallados++; fin(); };
      img.onerror = ()=>probar(k+1);
      img.src = `${base}.${exts[k]}`;
    };
    probar(0);
  });
}

function abrir(fecha){
  const r = MAP[fecha];
  const m = METAS[fecha];
  const tituloDia = parseFecha(fecha).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const rv = REVS[fecha];
  if(!r){
    const pasado = fecha <= claveFecha(new Date());
    if(!m && !rv && !pasado) return;
    const tabla = filasPlan(null, m, rv) + acumEtapas(fecha);
    const textoRev = rv && rv.obs ? `<div class="obs"><b>Revisión:</b> ${esc(rv.obs)}</div>` : '';
    const conceptoRev = rv && rv.concepto ? `<div class="concepto"><b>Concepto:</b> ${esc(rv.concepto)}</div>` : '';
    const aviso = rv ? '' : `<p class="muted" style="margin-top:12px">${pasado ? 'Sin operación registrada este día.' : 'Este día aún no tiene registro en el diario.'}</p>`;
    const caps = (pasado || rv) ? `<h2 style="margin-top:16px">Capturas</h2>${fotosHTML(fecha)}` : '';
    document.getElementById('m-titulo').textContent = tituloDia;
    document.getElementById('m-cuerpo').innerHTML = noticiaHTML(m) + (tabla ? `<table>${tabla}</table>` : '') + textoRev + conceptoRev + aviso + caps;
    document.getElementById('modal').classList.add('open');
    if(pasado || rv) cargarFotos(fecha);
    return;
  }
  const alertas = [];
  if(r.nAjustes>MAX_AJUSTES) alertas.push(`Se registraron ${r.nAjustes} ajustes; el plan permite máximo ${MAX_AJUSTES}.`);
  if(r.pctDisc < -MAX_PERDIDA_DISC) alertas.push(`La pérdida discrecional (${r.pctDisc.toFixed(2)} %) supera el ${MAX_PERDIDA_DISC} %.`);
  if(!r.operoEstrategia && r.nAjustes>0) alertas.push('Hubo ajustes sin operación de estrategia.');

  const ajustesTxt = r.ajustes.length ? r.ajustes.map((a,i)=>`A${i+1}: ${f2(a)}`).join(' · ') : '—';

  document.getElementById('m-titulo').textContent = parseFecha(fecha).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('m-cuerpo').innerHTML = `
    ${noticiaHTML(m)}
    <table>
      ${filasPlan(r,m,rv)}
      <tr><th>Desenlace de la señal</th><td class="${r.resultado==='TP'?'pos':'neg'}">${r.resultado}</td></tr>
      <tr><th>Operó la estrategia</th><td>${r.operoEstrategia?'Sí':'No (filtro)'}</td></tr>
      <tr><th>Resultado estrategia</th><td class="${signo(r.est)}">${r.operoEstrategia?f2(r.est):'—'}</td></tr>
      <tr><th>Ajustes discrecionales</th><td>${ajustesTxt}</td></tr>
      <tr><th>Total discrecional</th><td class="${signo(r.disc)}">${f2(r.disc)}</td></tr>
      <tr><th>Balance inicial</th><td>${f2(r.ini)}</td></tr>
      <tr><th>Balance final</th><td>${f2(r.fin)}${faltaUSD(r)}</td></tr>
      <tr><th>% del día</th><td class="${signo(r.pctDia)}">${r.pctDia.toFixed(2)} %</td></tr>
      ${acumEtapas(fecha)}
    </table>
    ${alertas.map(a=>`<div class="warn">⚠ ${esc(a)}</div>`).join('')}
    <div class="obs"><b>Observación:</b> ${esc(r.obs)}</div>
    ${r.concepto ? `<div class="concepto"><b>Concepto:</b> ${esc(r.concepto)}</div>` : ''}
    <h2 style="margin-top:16px">Capturas</h2>
    ${fotosHTML(fecha)}
  `;
  document.getElementById('modal').classList.add('open');
  cargarFotos(fecha);
}

function cargarFilas(filas, balanceExcel, revs){
  DATA = filas;
  REVS = revs || {};
  renderTodo();
  const ultimo = ROWS[ROWS.length-1].fin;
  const coincide = balanceExcel!==null && Math.abs(ultimo-balanceExcel) < 0.005;
  document.getElementById('msg').textContent = coincide ? '' :
    `⚠ El balance final del Excel (${f2(balanceExcel)}) no coincide con el del panel (${f2(ultimo)}). Revisa el balance inicial.`;
}

function procesarLibro(buf){
  const msg = document.getElementById('msg');
  const wb = XLSX.read(buf, {type:'array'});
  leerMetas(wb);
  renderPlan();
  const ws = wb.Sheets['Diario Completo Leo'];
  if(!ws){ msg.textContent = 'No encontré la hoja "Diario Completo Leo" en ese archivo.'; return; }
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const numv = v=>{
    if(typeof v === 'number') return v;
    if(v===null || v===undefined || String(v).trim()==='') return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? null : n;
  };
  const filas = [];
  let balanceExcel = null;
  rows.forEach(c=>{
    const x = c[0];
    if(typeof x !== 'number') return;
    const dt = new Date(Math.round((x - 25569) * 86400000));
    const fecha = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    filas.push({
      fecha,
      etapa: String(c[1]||'').trim(),
      resultado: String(c[3]||'').trim().toUpperCase(),
      direccion: String(c[4]||'').trim().toUpperCase() || null,
      estrategia: numv(c[5]),
      ajustes: [6,7,8,9].map(i=>numv(c[i])).filter(v=>v!==null),
      obs: String(c[14]||'').trim(),
      concepto: String(c[15]||'').trim()
    });
    { const b = numv(c[10]); if(b!==null) balanceExcel = b; }
  });
  // Fila sin resultado, operación, estrategia ni ajustes = revisión (p. ej. fin de semana): solo observación y capturas
  const esRev = f=> (!f.resultado || /^REV/.test(f.resultado)) && f.estrategia===null && !f.ajustes.length && !f.direccion;
  const revs = {};
  filas.filter(esRev).forEach(f=>{ revs[f.fecha] = {obs:f.obs, concepto:f.concepto, etapa:f.etapa}; });
  const dias = filas.filter(f=>!esRev(f));
  if(!dias.length){ msg.textContent = 'No encontré días en la hoja.'; return; }
  cargarFilas(dias, balanceExcel, revs);
  return true;
}

};

/* ---------- Resumen del mes ---------- */
const FRASE_MES = "Sé exactamente cuánto puedo perder. Acepto esa pérdida antes de entrar.";   // frase fija: cámbiala cuando quieras
const FRASES_ESTADO = {
  rojo:"Mi valor y mi capacidad están intactos en cada resultado.",
  verde:"Ganar por impulso no es disciplina.",
  sin:"No operar es una operación.",
  normal:"Confío en mi sistema y lo ejecuto con precisión y disciplina."
};
const PERDIDA_ETAPA = 7;           // % máximo de pérdida de la etapa (sobre el balance con el que empezó)
const ZONAS = [2,4,6];             // semáforo: normal < 2 %, amarillo < 4 %, rojo < 6 %, stop desde 6 %
const ESCEN = [[1,'Plan 100 %'],[0.25,'25 % del plan'],['real','Mi ritmo real']];
let escProy = 1;

const usd = v=>(v>=0?'+':'')+f2(v);
const fcorta = k=>parseFecha(k).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const pc = (a,b)=>b ? Math.round(a/b*100)+' %' : '—';
function barra(p){
  const t = p.reduce((a,x)=>a+x[0],0);
  return `<div class="bar">${t ? p.map(([n,c])=>n ? `<i style="width:${n/t*100}%;background:${c}"></i>` : '').join('') : ''}</div>`;
}

// Ritmo real: promedio de % por día OPERADO del mes (con pocos datos es solo una estimación)
function ritmoInfo(){
  const d = ROWS.filter(r=>enMes(r) && r.operaron);
  return {n:d.length, v: d.length ? d.reduce((a,r)=>a+r.pctDia,0)/d.length/100 : 0};
}
function ritmo(m, e){
  if(e===undefined) e = escProy;
  return m.plan>0 ? (e==='real' ? ritmoInfo().v : m.plan*e) : 0;
}
// Recorre el mes día por día: lo real queda y los días pendientes se proyectan
function calcResumen(e){
  const dm = ROWS.filter(enMes);
  const corte = new Date(vista.y, vista.m, 1);
  const antes = ROWS.filter(r=>parseFecha(r.fecha)<corte);
  const balIni = antes.length ? antes[antes.length-1].fin : CUENTA_INICIAL;
  const ult = ROWS.length ? ROWS[ROWS.length-1].fecha : '';
  const nd = new Date(vista.y, vista.m+1, 0).getDate();
  let bal = balIni; const segs = [];
  for(let d=1; d<=nd; d++){
    const k = claveFecha(new Date(vista.y, vista.m, d)), m = METAS[k], r = MAP[k];
    const et = etapaDe(k) || (m && m.etapa) || 'Sin etapa';
    let s = segs[segs.length-1];
    if(!s || s.etapa!==et){ s = {etapa:et, ini:bal, desde:k, hasta:k, reg:0, realUsd:0, real:0, pend:0, opDias:0, noticias:0}; segs.push(s); }
    s.hasta = k;
    if(m && m.plan>0) s.opDias++;
    if(m && m.noticia>0) s.noticias++;
    if(r){ s.reg++; s.real += r.pctDia; s.realUsd += r.plDia; bal = r.fin; }
    else if(k>ult && m && m.plan>0){ s.pend++; bal *= 1 + ritmo(m,e); }
    s.fin = bal;
  }
  return {dm, balIni, segs, ult};
}
function progresoEtapa(nombre, ult){
  const inf = ETAPAS.find(x=>x.nombre===nombre);
  const meta = inf && inf.meta>0 ? inf.meta*100 : 0;
  const real = ROWS.filter(r=>(r.etapa||etapaDe(r.fecha))===nombre).reduce((a,r)=>a+r.pctDia,0);
  const plan = Object.values(METAS).filter(m=>m.etapa===nombre && m.fecha>ult).reduce((a,m)=>a+ritmo(m)*100,0);
  return {meta, real, plan};
}
// Etapa actual: balance de inicio, objetivo, pérdida y lo que queda del plan.
// P = suma de % planeados restantes (techo); R = suma del riesgo de esos días (% planeado ÷ ratio)
function datosEtapa(){
  if(!ROWS.length) return null;
  const last = ROWS[ROWS.length-1], ult = last.fecha;
  const nombre = last.etapa || etapaDe(ult);
  const inf = ETAPAS.find(x=>x.nombre===nombre) || {op:0, meta:0};
  const filas = ROWS.filter(x=>(x.etapa||etapaDe(x.fecha))===nombre);
  const ini = (filas[0] || last).ini, bal = last.fin;
  const pend = Object.values(METAS).filter(m=>m.etapa===nombre && m.fecha>ult && m.plan>0);
  const todos = Object.values(METAS).filter(m=>m.etapa===nombre);
  return {nombre, inf, ini, bal, ult, pend,
    pctEtapa:(bal-ini)/ini*100,
    minPct:Math.min(0, ...filas.map(x=>(x.fin-ini)/ini*100)),
    P:pend.reduce((a,m)=>a+m.plan*100,0),
    R:pend.reduce((a,m)=>a+(m.ratio ? m.plan*100/m.ratio : 0),0),
    fin: todos.length ? todos[todos.length-1].fecha : '',
    meta:inf.meta*100, objetivo:ini*(1+inf.meta)};
}
function zonaDe(loss){ return loss<ZONAS[0]?0 : loss<ZONAS[1]?1 : loss<ZONAS[2]?2 : 3; }

function pintarFrase(){
  const E = datosEtapa(), last = ROWS[ROWS.length-1];
  let est = 'normal';
  if(E){
    const loss = Math.max(0, -E.pctEtapa);
    if(zonaDe(loss)>=1) est = 'rojo';
    else if((E.meta>0 && E.bal>=E.objetivo) || E.pctEtapa>=1) est = 'verde';
    else if(last && !last.operoEstrategia) est = 'sin';
  }
  const les = [...ROWS].reverse().find(r=>r.concepto);
  document.getElementById('rs-f').innerHTML =
    `<q>${esc(FRASE_MES)}</q><span class="hoy">${esc(FRASES_ESTADO[est])}</span>` +
    (les ? `<span class="les">Tu última lección (${fcorta(les.fecha)}): ${esc(les.concepto)}</span>` : '') +
    `<small>Yo declaro. Yo soy. Yo tengo. Yo recibo. Yo vibro. Yo manifiesto.</small>`;
}

function pintarResumen(){
  const R = calcResumen(escProy), dm = R.dm, hoy = claveFecha(new Date()), ult = R.ult;
  const sen = dm.length, tp = dm.filter(r=>r.resultado==='TP').length, sl = sen-tp;
  const est = dm.filter(r=>r.operoEstrategia);
  const eg = est.filter(r=>r.est>0).length, ep = est.filter(r=>r.est<0).length, eb = est.length-eg-ep;
  const aj = dm.flatMap(r=>r.ajustes.map(num));
  const ag = aj.filter(a=>a>0).length, ap = aj.filter(a=>a<0).length, ab = aj.length-ag-ap;
  const todas = [...est.map(r=>r.est), ...aj];
  const sumG = todas.filter(x=>x>0).reduce((a,b)=>a+b,0), sumP = -todas.filter(x=>x<0).reduce((a,b)=>a+b,0);
  const fpf = sumP ? (sumG/sumP).toFixed(2) : (sumG ? '∞' : '—');
  const gT = eg+ag, pT = ep+ap, nT = todas.length;
  const resUsd = dm.reduce((a,r)=>a+r.plDia,0);
  const balAct = dm.length ? dm[dm.length-1].fin : R.balIni;
  const pctMes = R.balIni ? (balAct-R.balIni)/R.balIni*100 : 0;
  const mejor = dm.length ? dm.reduce((a,b)=>b.plDia>a.plDia?b:a) : null;
  const peor  = dm.length ? dm.reduce((a,b)=>b.plDia<a.plDia?b:a) : null;
  const exc = dm.filter(r=>r.nAjustes>MAX_AJUSTES).length;
  let racha = 0; for(let i=dm.length-1; i>=0 && dm[i].plDia>=0; i--) racha++;
  // % planeado de cada día ya vivido: si no está en la hoja Metas se calcula con la regla (riesgo de la etapa × ratio del día de la semana)
  const planDia = k=>{ if(METAS[k]) return METAS[k].plan; const e = ETAPAS.find(x=>x.nombre===etapaDe(k)); return e ? e.op*(RIESGO[parseFecha(k).getDay()]||0) : 0; };
  const diasPlan = [];

  }
  const techo = diasPlan.reduce((a,m)=>a+m.plan*100,0), capt = dm.reduce((a,r)=>a+r.pctDia,0);

  const kpi = (t,v,sub,c)=>`<div><small>${t}</small><b class="${c||''}">${v}</b><em>${sub||''}</em></div>`;
  const kpis = [
    kpi('Resultado del mes', `${pctMes>=0?'+':''}${pctMes.toFixed(2)} %`, `${usd(resUsd)} USD`, signo(pctMes)),
    kpi('Balance actual', f2(balAct), `inicio de mes ${f2(R.balIni)}`),
    kpi('Acierto de la señal', pc(tp,sen), `${tp} TP · ${sl} SL de ${sen}`),
    kpi('Operaciones ganadas', gT, `${pc(gT,nT)} de ${nT} operaciones`, 'pos'),
    kpi('Operaciones perdidas', pT, `${pc(pT,nT)} de ${nT} operaciones`, pT?'neg':''),
    kpi('Factor de beneficio', fpf, 'ganado ÷ perdido'),
    kpi('Promedio por operación', nT ? usd(resUsd/nT) : '—', 'USD · expectativa real', nT ? signo(resUsd) : ''),
    kpi('Entradas de estrategia', `${est.length} de ${diasPlan.length}`, 'días de plan en que entraste'),
    kpi('Mejor día', mejor ? usd(mejor.plDia) : '—', mejor ? fcorta(mejor.fecha) : '', 'pos'),
    kpi('Peor día', peor && peor.plDia<0 ? usd(peor.plDia) : '—', peor && peor.plDia<0 ? fcorta(peor.fecha) : 'sin días en rojo', peor && peor.plDia<0 ? 'neg' : ''),
    kpi('Días sin pérdida', racha, 'racha actual'),
    kpi('Disciplina', pc(sen-exc, sen), `${exc} día(s) con más de ${MAX_AJUSTES} ajustes`, exc?'neg':'pos')
  ].join('');

  const fila = (t,partes,leg)=>`<div><div class="t"><b>${t}</b></div>${barra(partes)}<div class="leg2">${leg}</div></div>`;
  const gp = fila('Señal (TP / SL)', [[tp,'#2ecc71'],[sl,'#e74c3c']], `<span class="pos">${tp} TP</span><span class="neg">${sl} SL</span><span>${pc(tp,sen)} acierto</span>`)
    + fila('Estrategia', [[eg,'#2ecc71'],[ep,'#e74c3c'],[eb,'#8a96b0']], `<span class="pos">${eg} ganadas</span><span class="neg">${ep} perdidas</span><span>${eb} en cero</span><span>${sen-est.length} sin operar (filtro)</span>`)
    + fila('Ajustes', [[ag,'#2ecc71'],[ap,'#e74c3c'],[ab,'#8a96b0']], `<span class="pos">${ag} ganados</span><span class="neg">${ap} perdidos</span><span>${ab} en cero</span><span>${pc(ag,aj.length)} acierto</span>`);

  const planReal = `<div class="box">El techo del plan hasta hoy era <b>${techo.toFixed(2)} %</b> y capturaste <b class="${signo(capt)}">${capt.toFixed(2)} %</b> (${techo ? Math.round(capt/techo*100) : 0} % del techo). Entraste a la estrategia en <b>${est.length} de ${diasPlan.length}</b> días de plan: con filtro y volatilidad es normal quedar lejos del techo; el plan es hasta dónde puedes llegar, no una obligación de entrar.</div>`;

  // ----- Meta de etapa -----
  const E = datosEtapa();
  let metaHTML = '', semaforo = '';
  if(E && E.meta>0){
    const falta = E.objetivo - E.bal, faltaPct = falta/E.bal*100, n = E.pend.length;

    } else {
      const eqPlan = E.P ? faltaPct/E.P*100 : 0;
      const filas = [1,0.75,0.5].map(e=>{

        return `<tr><th>Entras ${Math.round(e*100)} % de los días (${Math.round(e*n)} de ${n})</th><td class="${col}">${ok ? 'acertar ≥ '+Math.ceil(p)+' %' : 'no alcanza con ese número de entradas'}</td></tr>`;
      }).join('');
      metaHTML = `<div class="box">Objetivo de <b>${esc(E.nombre)}</b>: ${f2(E.ini)} → <b>${f2(E.objetivo)}</b> (+${+E.meta.toFixed(2)} %). Hoy tienes ${f2(E.bal)}: te faltan <b style="color:var(--gold)">${f2(falta)} USD</b> (${faltaPct.toFixed(2)} %) en <b>${n} días de plan</b> hasta el ${E.fin ? fcorta(E.fin) : '—'}.
        <br>Eso es <b>≈ ${f2(n ? falta/n : 0)} USD por día de plan</b> y equivale al <b>${eqPlan.toFixed(0)} % del plan restante</b> (techo de ${E.P.toFixed(1)} %). Por eso el escenario del 25 % se parece a la meta.</div>
        <div class="box">Acierto necesario para llegar a la meta, según cuántos días logres entrar (mismo riesgo del plan, sin extender ni subir el tamaño):
        <table class="tb">${filas}</table>
        <span class="muted">Si no alcanzas, el plan es quedarte más días en la etapa (el Excel lo permite), no subir el riesgo. Cálculo aproximado, sin interés compuesto.</span></div>`;
    }
  }
  if(E){
    const loss = Math.max(0, -E.pctEtapa), z = zonaDe(loss), op = E.inf.op*100;

      [`Hasta −${ZONAS[0]} %`, 'Normal: mismo riesgo', `${+op.toFixed(2)} %`],
      [`−${ZONAS[0]} % a −${ZONAS[1]} %`, 'Amarillo: riesgo a la mitad', `${+(op/2).toFixed(2)} %`],
      [`−${ZONAS[1]} % a −${ZONAS[2]} %`, 'Rojo: pausa y revisas el diario antes de seguir', '0 %'],

    ].map((f,i)=>`<tr class="z${i} ${i===z?'on':''}"><th>${f[0]}</th><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('');
    semaforo = `<div class="box">Pérdida máxima de la etapa: <b>${PERDIDA_ETAPA} %</b> sobre ${f2(E.ini)} = ${f2(E.ini*PERDIDA_ETAPA/100)} USD; piso en <b>${f2(E.ini*(1-PERDIDA_ETAPA/100))}</b>. Pérdida actual: <b class="${loss?'neg':'pos'}">${loss.toFixed(2)} %</b>; tu punto más bajo fue ${E.minPct.toFixed(2)} % (usaste ${(Math.abs(E.minPct)/PERDIDA_ETAPA*100).toFixed(0)} % del margen).
      <table class="tb"><tr><th>Pérdida de la etapa</th><th>Qué hacer</th><th>Riesgo por operación</th></tr>${filasZ}</table></div>`;
  }

  const casos = [
    ['Entra y va a TP','Cumples el ratio del día, sin extender.'],
    ['Entra pero hay ruido','Aseguras (50 % o cero) y dejas correr, como el 12 y 13 de octubre.'],
    ['No entra por volatilidad o filtro','El día vale 0. No compensas; el SL ahorrado es capital protegido.'],
    ['Día con noticia','El plan baja a la mitad.'],
    ['SL','Aceptas la pérdida (ya la aceptaste antes de entrar) y revisas el semáforo antes del siguiente día.'],
    ['Vas atrasado del plan','No subes el riesgo: el atraso se recupera con días, no con tamaño.'],
    [`Más de ${MAX_AJUSTES} ajustes`,'Te detienes: ganar por impulso no es disciplina (20 de octubre).'],
    ['Meta cumplida','Proteges lo ganado y no abres por inercia.']
  ].map(c=>`<tr><th>${c[0]}</th><td>${c[1]}</td></tr>`).join('');

  const segs = R.segs.filter(s=>s.opDias||s.reg).map(s=>{
    const p = progresoEtapa(s.etapa, ult), col = ETAPA_COL[s.etapa]||'#94a3b8';

    if(p.meta){

    }
    return `<div class="seg" style="--c:${col}"><h4>${esc(s.etapa)}</h4><div class="d">${fcorta(s.desde)} – ${fcorta(s.hasta)} · ${s.opDias} días de operación${s.noticias?` · 📰 ${s.noticias}`:''}</div>

  const ratios = [1,2,3,4,5,6,0].map(d=>`${dn[d]} ${RIESGO[d]||0}`).join(' · ');

  document.getElementById('rs-b').innerHTML = `
    <h3>KPIs de ${MESES[vista.m]}</h3><div class="rk">${kpis}</div>

    <h3>Plan vs. real</h3>${planReal}
    <h3>Meta de la etapa: qué hacer para llegar</h3>${metaHTML || '<p class="muted">La etapa actual no tiene objetivo.</p>'}
    <h3>Tope de pérdida de la etapa</h3>${semaforo}
    <h3>Proyección por etapas · ${MESES[vista.m]}</h3>
    <div class="esc">Escenario: ${chips}</div>
    <table class="tb" style="margin-bottom:10px"><tr><th>Escenario</th><th>Balance a fin de mes</th><th>Desde hoy</th></tr>${comp}</table>
    <div class="muted" style="margin:0 0 10px;font-size:12px">Plan 100 % = techo si cada día pendiente cierra en su % planeado. «Mi ritmo real» = ${(ri.v*100).toFixed(2)} % por día operado${ri.n<10?` (solo ${ri.n} días: estimación con pocos datos)`:''}, aplicado a cada día de plan, así que es optimista si no entras todos los días.</div>
    <div class="segs">${segs}</div>
    <h3>Próximos 7 días</h3><div class="ag">${prox || '<span class="muted">Sin plan próximo</span>'}</div>
    <h3>Qué hacer en cada caso</h3><div class="box"><table class="tb">${casos}</table></div>
    <h3>Reglas del mes</h3>
    <ul class="reglas">
      <li>Antes de entrar: sé exactamente cuánto arriesgo y lo acepto.</li>
      <li>Máximo <b>${MAX_AJUSTES} ajustes</b> al día (con estrategia, 1 ajuste). Pérdida discrecional máxima: <b>${MAX_PERDIDA_DISC} %</b>.</li>
      <li>${etReg || 'Sin etapas definidas'}. El % planeado del día = ratio × % por operación.</li>
      <li>Ratio por día: ${ratios}.</li>
      <li>Día con noticia: el plan baja a la mitad.${noticias ? `<ul>${noticias}</ul>` : ''}</li>
    </ul>
    <div class="cierre">Y así hecho está. Gracias, gracias, gracias. 🙏</div>`;
  document.querySelectorAll('#rs-b [data-esc]').forEach(b=>b.onclick = ()=>{ escProy = b.dataset.esc==='real' ? 'real' : parseFloat(b.dataset.esc); pintarResumen(); });
}
function abrirResumen(){
  pintarFrase();
  pintarResumen();
  document.getElementById('rs').classList.add('open');
  document.querySelector('#rs .rsheet').scrollTop = 0;
}
document.getElementById('btnRes').onclick = abrirResumen;
document.getElementById('rs-x').onclick = ()=>document.getElementById('rs').classList.remove('open');
document.getElementById('rs').addEventListener('click', e=>{ if(e.target.id==='rs') e.currentTarget.classList.remove('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('rs').classList.remove('open'); });
</script>
